name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and optional test capabilities
        run: python -m pip install -e ".[dev,database,demo,browser]"
      - name: Install Chromium
        run: python -m playwright install chromium --with-deps
      - name: Run tests
        run: python -m pytest
